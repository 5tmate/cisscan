[project]
name = "cisscan"
version = "0.1.0"
description = "CIS AWS Foundations Benchmark v5.0.0 live-account scanner: collectors feed a Terraform-shaped resource JSON into OPA rego rules"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
